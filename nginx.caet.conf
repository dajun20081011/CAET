# CAET 前端容器 Nginx 配置
# 静态 SPA + 反代 /api、/uploads、/health 到 caet-backend:8000
server {
    listen 80;
    server_name crew.cabinvoice.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crew.cabinvoice.cn;

    ssl_certificate /etc/letsencrypt/live/crew.cabinvoice.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crew.cabinvoice.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（含前缀 /api）
    location /api/ {
        proxy_pass http://caet-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 媒体文件
    location /media/ {
        proxy_pass http://caet-backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端健康检查透传
    location /health {
        proxy_pass http://caet-backend:8000/health;
    }
}

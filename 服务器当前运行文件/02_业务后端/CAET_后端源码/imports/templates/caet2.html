<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CAET2课程模板</title></head>
<body>
<article data-caet-template="caet2" data-schema-version="1.0">
  <header><h1 data-field="title">特殊餐食确认</h1></header>
  <section data-section="scenario"><h2>情境</h2><p data-field="scenario">乘务员与旅客确认特殊餐食预订信息。</p></section>
  <section data-section="chinese"><h2>中文表达</h2><p data-field="chinese_prompt">我可以跟您确认一下您的特殊餐食吗？</p></section>
  <section data-section="english"><h2>参考表达</h2><p data-field="standard_english">May I confirm your special meal request with you?</p></section>
  <section data-section="audio"><h2>标准朗读</h2><audio data-field="standard_audio" src="audio/main.mp3" controls></audio></section>
  <section data-section="keywords"><h2>重点词汇</h2><ul><li data-keyword><span data-field="word">confirm</span><span data-field="phonetic"></span><span data-field="meaning">确认</span><span data-field="note"></span><audio data-field="audio" src="audio/confirm.mp3" controls></audio></li><li data-keyword><span data-field="word">special meal</span><span data-field="phonetic"></span><span data-field="meaning">特殊餐食</span><span data-field="note"></span><audio data-field="audio" src="audio/special-meal.mp3" controls></audio></li></ul></section>
  <section data-section="tips"><h2>表达提示</h2><ul><li data-expression-tip>使用 May I... 表达礼貌询问。</li><li data-expression-tip>special meal request 表示特殊餐食申请或预订。</li></ul></section>
</article>
</body>
</html>

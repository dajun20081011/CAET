services:
  api:
    build: ./app
    container_name: caet-api
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CAET_ADMIN_TOKEN: ${CAET_ADMIN_TOKEN}
    depends_on:
      - postgres
      - redis
    expose:
      - "8000"
    volumes:
      - ./uploads:/uploads
    networks:
      - caet-network

  postgres:
    image: postgres:16-alpine
    container_name: caet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - caet-network

  redis:
    image: redis:7-alpine
    container_name: caet-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    networks:
      - caet-network

  nginx:
    image: nginx:alpine
    container_name: caet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/srv/caet/uploads:ro
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - caet-network

networks:
  caet-network:
    driver: bridge

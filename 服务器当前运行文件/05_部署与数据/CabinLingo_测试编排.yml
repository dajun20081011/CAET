services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ["${PHASE7_ENV_FILE:-.env.staging}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - phase7_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [phase7]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - phase7_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [phase7]

  api:
    build:
      context: ./backend-package/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ["${PHASE7_ENV_FILE:-.env.staging}"]
    environment:
      APP_ENV: staging
      ENABLE_DEMO_SEED: "false"
      DATABASE_URL: ${DATABASE_URL:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      UPLOAD_DIR: /uploads
      COURSE_MEDIA_MAX_BYTES: ${COURSE_MEDIA_MAX_BYTES:-104857600}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["8000"]
    volumes:
      - phase7_uploads:/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/core/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [phase7]

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:28080:80"
    volumes:
      - ./frontend/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [phase7]

volumes:
  phase7_postgres:
  phase7_redis:
  phase7_uploads:

networks:
  phase7:

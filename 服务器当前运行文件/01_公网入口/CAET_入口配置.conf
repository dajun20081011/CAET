

# CabinLingo production routing for crew.cabinvoice.cn

# ============================================================
# CabinLingo production public gateway
# Domain: crew.cabinvoice.cn
# Cache policy:
#   HTML/root      -> no-store
#   service worker -> no-store
#   hashed assets  -> 1 year immutable
# Generated: 20260903_004147
# ============================================================

server {
    listen 80;
    server_name crew.cabinvoice.cn;

    return 301 https://crew.cabinvoice.cn$request_uri;
}

server {
    listen 443 ssl;
    server_name crew.cabinvoice.cn;

    ssl_certificate /etc/nginx/ssl/crew.cabinvoice.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/crew.cabinvoice.cn.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # Pronunciation assessment: reuse CabinLingo login before model access.
    location = /pronunciation-api/ready {
        proxy_pass http://cabinlingo-pronunciation-engine:8000/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location = /_pronunciation_auth {
        internal;
        proxy_pass http://api:8000/api/v1/core/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host crew.cabinvoice.cn;
        proxy_set_header X-Original-URI $request_uri;
    }

    location ^~ /pronunciation-api/ {
        auth_request /_pronunciation_auth;
        proxy_pass http://cabinlingo-pronunciation-engine:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 4m;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------
    # Main SPA entry: NEVER keep stale HTML
    # --------------------------------------------------------
    location = / {
        proxy_pass https://cabinlingo-nginx-1:443/;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name crew.cabinvoice.cn;

        proxy_http_version 1.1;

        proxy_set_header Host crew.cabinvoice.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        proxy_pass https://cabinlingo-nginx-1:443/index.html;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name crew.cabinvoice.cn;

        proxy_http_version 1.1;

        proxy_set_header Host crew.cabinvoice.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # --------------------------------------------------------
    # Service worker / manifest: also NEVER stale
    # --------------------------------------------------------
    location ~* ^/(service-worker\.js|sw\.js|manifest\.webmanifest|site\.webmanifest)$ {
        proxy_pass https://cabinlingo-nginx-1:443;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name crew.cabinvoice.cn;

        proxy_http_version 1.1;

        proxy_set_header Host crew.cabinvoice.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # --------------------------------------------------------
    # Vite hashed assets: safe to cache for one year
    # e.g. /assets/index-hOkUkTWW.js
    # New releases generate new filenames automatically.
    # --------------------------------------------------------
    location /assets/ {
        proxy_pass https://cabinlingo-nginx-1:443;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name crew.cabinvoice.cn;

        proxy_http_version 1.1;

        proxy_set_header Host crew.cabinvoice.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --------------------------------------------------------
    # API / audio / learning cards / all remaining resources
    # --------------------------------------------------------
    location / {
        proxy_pass https://cabinlingo-nginx-1:443;

        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name crew.cabinvoice.cn;

        proxy_http_version 1.1;

        proxy_set_header Host crew.cabinvoice.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
